28" y="-40" width="56" height="59" rx="13" fill="#1681a5"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17v31M-10 14h20M-15-7h30M-11-7-18 7h14zM11-7 4 7h14z"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Questions &amp; disagreement</text><text x="0" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#47646b">April readout</text></g><g transform="translate(690 116)"><path d="M-89.0 19 0-1 89.0 19v11L0 51l-89.0-21z" fill="#9fc9c9"/><path d="M-89.0 19 0-1 89.0 19 0 41z" fill="#e3efea"/><rect x="-28" y="-40" width="56" height="59" rx="13" fill="#b48816"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-14" width="10" height="10" rx="2"/><rect x="4" y="-14" width="10" height="10" rx="2"/><rect x="-14" y="4" width="10" height="10" rx="2"/><rect x="4" y="4" width="10" height="10" rx="2"/><path d="M-4-9h8M-9-4v8M9-4v8M-4 9h8"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Four developed futures</text><text x="0" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#47646b">May scenario deck</text></g><g transform="translate(970 116)"><path d="M-89.0 19 0-1 89.0 19v11L0 51l-89.0-21z" fill="#9fc9c9"/><path d="M-89.0 19 0-1 89.0 19 0 41z" fill="#e3efea"/><rect x="-28" y="-40" width="56" height="59" rx="13" fill="#c55123"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-16 13-10v12c0 8-13 15-13 15S-13 10-13 2v-12zM-6 0l4 5L7-6"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Actions &amp; cautions</text><text x="0" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#47646b">June workshop walls</text></g><path d="M130 253V273H970V