<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 615" role="img" aria-labelledby="motion-title motion-desc">
<title id="motion-title">The future of law across three overlapping horizons</title>
<desc id="motion-desc">An original diagram with three connected layers. H1: established legal systems, agreements, disputes and compliance. H2: experiments in automation, integration and new services. H3: emerging patterns of access, authority and new roles. Moving points represent activity within each horizon, not a forecast of progress.</desc>
