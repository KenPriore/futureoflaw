<svg xmlns="http://www.w3.org/2000/svg" class="system-graphic" viewBox="0 0 760 350" role="img" aria-labelledby="world-four-system-title world-four-system-desc"><title id="world-four-system-title">World Four System</title><desc id="world-four-system-desc">Routine legal work flows through an integrated system. High-stakes decisions escalate to a person with authority to challenge or stop it. That authority is contested.</desc><g font-family="Arial,Helvetica,sans-serif" fill="#123c43"><path d="M45 213 365 164 710 241v22L390 326 45 239z" fill="#9fc9c9"/><path d="M45 213 365 164 710 241 390 304z" fill="#d5e9e1"/><path id="w4-routine" d="M99 240 260 209Q282 202 306 212L458 253Q480 260 505 251L659 222" fill="none" stroke="#007e80" stroke-opacity=".32" stroke-width="3"/><circle data-runner="w4-routine" r="5" fill="#007e80" stroke="white" stroke-width="2"/><path id="w4-escalate" d="M288 205Q281 107 380 96Q471 96 470 232" fill="none" stroke="#c55123" stroke-opacity=".32" stroke-width="3"/><circle data-runner="w4-escalate" r="5" fill="#c55123" stroke="white" stroke-width="2"/><g transform="translate(160 192)"><path d="M-66.0 19 0-1 66.0 19v11L0 51l-66.0-21z" fill="#9fc9c9"/><path d="M-66.0 19 0-1 66.0 19 0 41z" fill="#e3efea"/><rect x="-28" y="-40" width="56" height="59" rx="13" fill="#007e80"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10-16H3l9 9v23h-22zM3-16v9h9M-4 0h9M-4 7h9"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Automated work</text></g><g transform="translate(590 221)"><path d="M-66.0 19 0-1 66.0 19v11L0 51l-66.0-21z" fill="#9fc9c9"/><path d="M-66.0 19 0-1 66.0 19 0 41z" fill="#e3efea"/><rect x="-28" y="-40" width="56" height="59" rx="13" fill="#007e80"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-14" width="10" height="10" rx="2"/><rect x="4" y="-14" width="10" height="10" rx="2"/><rect x="-14" y="4" width="10" height="10" rx="2"/><rect x="4" y="4" width="10" height="10" rx="2"/><path d="M-4-9h8M-9-4v8M9-4v8M-4 9h8"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Decisions &amp; action</text></g><g transform="translate(380 65)"><path d="M-83.0 19 0-1 83.0 19v11L0 51l-83.0-21z" fill="#9fc9c9"/><path d="M-83.0 19 0-1 83.0 19 0 41z" fill="#e3efea"/><rect x="-28" y="-40" width="56" height="59" rx="13" fill="#c55123"/><g transform="translate(0 -11)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cy="-8" r="6"/><path d="M-13 14v-4a13 13 0 0 1 26 0v4"/></g><text x="0" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#123c43">Human authority</text><text x="0" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#47646b">Inspect · Challenge · Override</text></g></g></svg>